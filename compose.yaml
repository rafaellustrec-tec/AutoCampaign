services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agency
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - agency_pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency -d agency"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      target: web
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build:
      context: .
      target: worker
    env_file: .env
    command: ["npm", "run", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  agency_pg:
